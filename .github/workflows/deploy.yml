name: Deploy to GitHub Pages

on:
  push:
    branches: [V1.0.1] # 如果使用 master 分支，改成 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: FastXDist # 要部署的文件夹
          branch: gh-pages # 部署到 gh-pages 分支
